<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gift Card QR Code Generator</title>
<!-- External Libraries -->
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
  :root {
    --page-width: 8.5in;
    --page-height: 11in;
    --grid-cols: 3;
    --header-font-family: system-ui, sans-serif;
    --header-font-size: 14px;
    --footer-font-family: system-ui, sans-serif;
    --footer-font-size: 11px;
  }

  body { font-family: system-ui, -apple-system, sans-serif; padding: 2rem; background: #f8fafc; color: #1e293b; }
  .card { max-width: 950px; margin: auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
  .header-box { border-bottom: 2px solid #f1f5f9; margin-bottom: 1.5rem; padding-bottom: 1rem; }
  h1 { margin: 0; color: #0f172a; font-size: 1.75rem; }
  .sub-text { color: #64748b; margin-top: 0.5rem; font-size: 1rem; }
  .drop-zone { border: 2px dashed #cbd5e1; padding: 2.5rem; text-align: center; border-radius: 8px; background: #fdfdfd; cursor: pointer; transition: all 0.2s; }
  .drop-zone:hover { border-color: #3b82f6; background: #f1f7ff; }
  
  .controls-panel { 
    margin-top: 1.5rem; 
    padding: 1.25rem; 
    background: #f8fafc; 
    border: 1px solid #e2e8f0; 
    border-radius: 8px; 
    display: none; 
    flex-direction: column; 
    gap: 1.25rem; 
  }

  .controls-section {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: center;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 1rem;
  }

  .controls-section:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }
  
  .control-group { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.85rem; font-weight: 600; color: #475569; }
  .control-group-row { display: flex; align-items: center; gap: 0.5rem; }
  
  input[type="text"], select { 
    padding: 0.5rem; 
    border-radius: 6px; 
    border: 1px solid #cbd5e1; 
    background: white; 
    font-family: inherit; 
    font-size: 0.9rem;
  }

  input[type="file"].logo-input {
    font-size: 0.85rem;
  }

  .btn-group { display: flex; gap: 0.75rem; margin-top: 1rem; }
  .btn { padding: 0.8rem 1.5rem; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .btn-zip { background: #059669; color: white; }
  .btn-zip:hover { background: #047857; }
  .btn-print { background: #2563eb; color: white; }
  .btn-print:hover { background: #1d4ed8; }
  .btn:disabled { background: #94a3b8; cursor: not-allowed; opacity: 0.7; }
  
  #output { 
    display: grid; 
    grid-template-columns: repeat(var(--grid-cols), 1fr); 
    gap: 1rem; 
    margin-top: 2rem; 
  }
  
  .qr-card { 
    border: 1px solid #e2e8f0; 
    padding: 0.75rem; 
    text-align: center; 
    border-radius: 8px; 
    background: #fff; 
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    overflow: hidden;
  }
  
  .card-header-text {
    font-family: var(--header-font-family);
    font-size: var(--header-font-size);
    font-weight: bold;
    color: #0f172a;
    margin-bottom: 0.35rem;
    word-break: break-word;
  }

  .card-footer-text {
    font-family: var(--footer-font-family);
    font-size: var(--footer-font-size);
    color: #475569;
    margin-top: 0.35rem;
    word-break: break-word;
  }

  .qr-card canvas { width: 100%; max-width: 200px; height: auto; }
  .label { font-size: 0.7rem; color: #64748b; word-break: break-all; font-family: monospace; margin-top: 0.2rem; }
  
  .hide-labels .label { display: none !important; }

  .status { font-size: 0.9rem; font-weight: 600; color: #334155; }

  /* --- FIXED ALIGNMENT PRINT STYLES --- */
  @media print {
    @page {
      size: var(--page-width) var(--page-height);
      margin: 0;
    }
    
    html, body { 
      background: white; 
      padding: 0; 
      margin: 0; 
      color: black; 
      width: 100%;
      height: 100%;
    }

    .card { max-width: 100%; padding: 0; box-shadow: none; border: none; }
    .header-box, .drop-zone, .controls-panel, .btn-group, .status { display: none !important; }
    
    #output { 
      display: block !important;
      margin: 0;
      padding: 0;
    }

    .print-page {
      width: var(--page-width);
      height: var(--page-height);
      padding: 0.4in;
      box-sizing: border-box;
      display: grid !important;
      grid-template-columns: repeat(var(--grid-cols), 1fr);
      grid-auto-rows: 1fr;
      gap: 0.2in;
      page-break-after: always;
      break-after: page;
      overflow: hidden;
    }
    
    .qr-card { 
      border: 1px dashed #a1a1aa; 
      box-shadow: none;
      border-radius: 0;
      padding: 0.15in;
      height: 100%;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .qr-card canvas {
      max-height: 65%;
      max-width: 80%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .label {
      font-size: 8pt;
      line-height: 1;
    }
  }
</style>
</head>
<body>

<div class="card">
    <div class="header-box">
        <h1>Gift Card QR Code Generator</h1>
        <p class="sub-text" id="targetDisplay">Upload the exported CSV file below</p>
    </div>
    
    <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".csv" style="display:none">
        <p id="statusText"><strong>Click to select</strong> or drag your CSV file here</p>
    </div>

    <!-- Layout & Customization Options -->
    <div class="controls-panel" id="controlsPanel">
        <!-- Page Layout Settings -->
        <div class="controls-section">
            <div class="control-group">
                <label for="paperSize">Paper Size</label>
                <select id="paperSize">
                    <option value="letter">Letter (8.5" x 11")</option>
                    <option value="a4">A4 (210mm x 297mm)</option>
                    <option value="legal">Legal (8.5" x 14")</option>
                </select>
            </div>

            <div class="control-group">
                <label for="itemsPerPage">QR Codes per Page</label>
                <select id="itemsPerPage">
                    <option value="4">4 per page (2 x 2)</option>
                    <option value="6">6 per page (2 x 3)</option>
                    <option value="9" selected>9 per page (3 x 3)</option>
                    <option value="12">12 per page (3 x 4)</option>
                    <option value="16">16 per page (4 x 4)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="logoInput">QR Center Logo</label>
                <input type="file" id="logoInput" class="logo-input" accept="image/*">
            </div>

            <div class="control-group" style="justify-content: flex-end;">
                <div class="control-group-row" style="margin-top: 1.25rem;">
                    <input type="checkbox" id="toggleUrl" checked>
                    <label for="toggleUrl" style="cursor:pointer;">Show URL Label</label>
                </div>
            </div>
        </div>

        <!-- Custom Header Settings -->
        <div class="controls-section">
            <div class="control-group" style="flex: 2; min-width: 200px;">
                <label for="headerText">Custom Header Text</label>
                <input type="text" id="headerText" placeholder="e.g. SPECIAL GIFT CARD">
            </div>

            <div class="control-group">
                <label for="headerFontFamily">Header Font Style</label>
                <select id="headerFontFamily">
                    <option value="system-ui, sans-serif">Sans-Serif</option>
                    <option value="'Georgia', serif">Serif (Georgia)</option>
                    <option value="'Courier New', monospace">Monospace</option>
                    <option value="'Impact', sans-serif">Impact</option>
                    <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
                </select>
            </div>

            <div class="control-group">
                <label for="headerFontSize">Header Font Size</label>
                <select id="headerFontSize">
                    <option value="10px">10px</option>
                    <option value="12px">12px</option>
                    <option value="14px" selected>14px</option>
                    <option value="16px">16px</option>
                    <option value="18px">18px</option>
                    <option value="20px">20px</option>
                </select>
            </div>
        </div>

        <!-- Custom Footer Settings -->
        <div class="controls-section">
            <div class="control-group" style="flex: 2; min-width: 200px;">
                <label for="footerText">Custom Footer Text</label>
                <input type="text" id="footerText" placeholder="e.g. Non-refundable • Terms Apply">
            </div>

            <div class="control-group">
                <label for="footerFontFamily">Footer Font Style</label>
                <select id="footerFontFamily">
                    <option value="system-ui, sans-serif">Sans-Serif</option>
                    <option value="'Georgia', serif">Serif (Georgia)</option>
                    <option value="'Courier New', monospace">Monospace</option>
                    <option value="'Impact', sans-serif">Impact</option>
                    <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
                </select>
            </div>

            <div class="control-group">
                <label for="footerFontSize">Footer Font Size</label>
                <select id="footerFontSize">
                    <option value="9px">9px</option>
                    <option value="11px" selected>11px</option>
                    <option value="13px">13px</option>
                    <option value="15px">15px</option>
                </select>
            </div>
        </div>
    </div>
    
    <div class="btn-group">
        <button id="downloadBtn" class="btn btn-zip" style="display:none;">Download All as ZIP</button>
        <button id="printBtn" class="btn btn-print" style="display:none;">Print Sheet</button>
    </div>

    <div class="status" id="counter" style="margin-top:1rem;"></div>
    <div id="output"></div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const logoInput = document.getElementById('logoInput');
const dropZone = document.getElementById('dropZone');
const output = document.getElementById('output');
const downloadBtn = document.getElementById('downloadBtn');
const printBtn = document.getElementById('printBtn');
const counter = document.getElementById('counter');
const controlsPanel = document.getElementById('controlsPanel');

const paperSizeSelect = document.getElementById('paperSize');
const itemsPerPageSelect = document.getElementById('itemsPerPage');
const toggleUrlCheckbox = document.getElementById('toggleUrl');

const headerTextInput = document.getElementById('headerText');
const headerFontFamilySelect = document.getElementById('headerFontFamily');
const headerFontSizeSelect = document.getElementById('headerFontSize');

const footerTextInput = document.getElementById('footerText');
const footerFontFamilySelect = document.getElementById('footerFontFamily');
const footerFontSizeSelect = document.getElementById('footerFontSize');

let rawCsvText = "";
let loadedLogoImg = null;

dropZone.onclick = () => fileInput.click();

fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        rawCsvText = event.target.result;
        processCSV(rawCsvText);
    };
    reader.readAsText(file);
};

// Handle optional Logo image loading
logoInput.onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                loadedLogoImg = img;
                if (rawCsvText) processCSV(rawCsvText);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    } else {
        loadedLogoImg = null;
        if (rawCsvText) processCSV(rawCsvText);
    }
};

function processCSV(text) {
    output.innerHTML = '';
    const rows = text.split(/\r?\n/).filter(row => row.trim() !== "");
    if (rows.length < 2) {
        alert("CSV appears to be empty or missing data rows.");
        return;
    }

    const headers = rows[0].split(',').map(h => h.trim().toUpperCase());
    let columnIndex = headers.indexOf("URL"); 
    if (columnIndex === -1) columnIndex = 2;

    let validValues = [];
    rows.forEach((row, index) => {
        if (index === 0) return;
        const columns = row.split(',');
        const val = columns[columnIndex] ? columns[columnIndex].trim() : null;
        if (val) validValues.push(val);
    });

    const itemsPerPage = parseInt(itemsPerPageSelect.value, 10);
    let currentPageContainer = null;

    const headerVal = headerTextInput.value.trim();
    const footerVal = footerTextInput.value.trim();

    validValues.forEach((val, index) => {
        if (index % itemsPerPage === 0) {
            currentPageContainer = document.createElement('div');
            currentPageContainer.className = 'print-page';
            output.appendChild(currentPageContainer);
        }

        const container = document.createElement('div');
        container.className = 'qr-card';
        
        // Custom Header Element
        if (headerVal) {
            const headerEl = document.createElement('div');
            headerEl.className = 'card-header-text';
            headerEl.innerText = headerVal;
            container.appendChild(headerEl);
        }

        const canvas = document.createElement('canvas');
        container.appendChild(canvas);

        // URL Label Element
        const label = document.createElement('div');
        label.className = 'label';
        label.innerText = val;
        container.appendChild(label);

        // Custom Footer Element
        if (footerVal) {
            const footerEl = document.createElement('div');
            footerEl.className = 'card-footer-text';
            footerEl.innerText = footerVal;
            container.appendChild(footerEl);
        }

        currentPageContainer.appendChild(container);

        // Render QR Code
        const qr = new QRious({
            element: canvas,
            value: val,
            size: 600, 
            level: 'H' 
        });

        // Overlay Logo if loaded
        if (loadedLogoImg) {
            const ctx = canvas.getContext('2d');
            const logoSize = canvas.width * 0.22; // 22% of canvas size
            const center = (canvas.width - logoSize) / 2;
            
            // Draw white background block behind logo to ensure scannability
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(center - 4, center - 4, logoSize + 8, logoSize + 8);
            ctx.drawImage(loadedLogoImg, center, center, logoSize, logoSize);
        }
    });

    counter.innerText = `Successfully processed ${validValues.length} gift cards.`;
    if (validValues.length > 0) {
        downloadBtn.style.display = 'inline-block';
        printBtn.style.display = 'inline-block';
        controlsPanel.style.display = 'flex';
        updatePrintLayout(); 
    }
}

function updatePrintLayout() {
    const root = document.documentElement;
    const paper = paperSizeSelect.value;
    const count = itemsPerPageSelect.value;

    if (paper === 'a4') {
        root.style.setProperty('--page-width', '210mm');
        root.style.setProperty('--page-height', '297mm');
    } else if (paper === 'legal') {
        root.style.setProperty('--page-width', '8.5in');
        root.style.setProperty('--page-height', '14in');
    } else { 
        root.style.setProperty('--page-width', '8.5in');
        root.style.setProperty('--page-height', '11in');
    }

    let cols = 3;
    if (count === '4') cols = 2;
    if (count === '6') cols = 2;
    if (count === '9') cols = 3;
    if (count === '12') cols = 3;
    if (count === '16') cols = 4;

    root.style.setProperty('--grid-cols', cols);

    // Dynamic Typography CSS Variables
    root.style.setProperty('--header-font-family', headerFontFamilySelect.value);
    root.style.setProperty('--header-font-size', headerFontSizeSelect.value);
    root.style.setProperty('--footer-font-family', footerFontFamilySelect.value);
    root.style.setProperty('--footer-font-size', footerFontSizeSelect.value);
}

// Event Listeners for Live Updates
itemsPerPageSelect.addEventListener('change', () => {
    updatePrintLayout();
    if (rawCsvText) processCSV(rawCsvText);
});

paperSizeSelect.addEventListener('change', updatePrintLayout);

headerTextInput.addEventListener('input', () => { if (rawCsvText) processCSV(rawCsvText); });
headerFontFamilySelect.addEventListener('change', updatePrintLayout);
headerFontSizeSelect.addEventListener('change', updatePrintLayout);

footerTextInput.addEventListener('input', () => { if (rawCsvText) processCSV(rawCsvText); });
footerFontFamilySelect.addEventListener('change', updatePrintLayout);
footerFontSizeSelect.addEventListener('change', updatePrintLayout);

toggleUrlCheckbox.addEventListener('change', () => {
    if (toggleUrlCheckbox.checked) {
        output.classList.remove('hide-labels');
    } else {
        output.classList.add('hide-labels');
    }
});

printBtn.onclick = () => window.print();

downloadBtn.onclick = async () => {
    downloadBtn.disabled = true;
    downloadBtn.innerText = "Creating ZIP...";

    const zip = new JSZip();
    const cards = document.querySelectorAll('.qr-card');
    
    cards.forEach((card, i) => {
        const canvas = card.querySelector('canvas');
        const labelText = card.querySelector('.label') ? card.querySelector('.label').innerText : `card_${i+1}`;
        
        const safeName = labelText.replace(/[^a-z0-9]/gi, '_').substring(0, 20);
        const fileName = `GiftCard_${i+1}_${safeName}.png`;
        
        const dataUrl = canvas.toDataURL("image/png");
        const base64Data = dataUrl.replace(/^data:image\/(png|jpg);base64,/, "");
        zip.file(fileName, base64Data, {base64: true});
    });

    zip.generateAsync({type: "blob"}).then((content) => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = "Gift_Card_QRs.zip";
        link.click();
        downloadBtn.disabled = false;
        downloadBtn.innerText = "Download All as ZIP";
    });
};
</script>
</body>
</html>
